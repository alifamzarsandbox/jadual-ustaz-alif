name: Publish Jadual Ustaz Alif

# Uploading source alone does not publish the timetable.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
      - name: Verify Pages project path
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: test "$REPOSITORY_NAME" = jadual-ustaz-alif || { echo 'Use repository name jadual-ustaz-alif for the configured Pages path.'; exit 1; }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:pwa
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified export
        id: deployment
        uses: actions/deploy-pages@v4
